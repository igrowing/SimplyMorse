name: simply_morse
description: "SimplyMorse - Audio-visual Morse code encoder-decoder."
publish_to: 'none'
homepage: "https://github.com/igrowing/SimplyMorse"

version: 0.5.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.1.0
  camera: ^0.12.1
  cupertino_icons: ^1.0.8
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  get_it: ^9.2.1
  meta: ^1.15.0
  path_provider: ^2.1.5
  provider: ^6.1.2
  record: ^7.1.1
  share_plus: ^13.3.0
  shared_preferences: ^2.3.2
  torch_light: ^2.0.0
  url_launcher: ^6.3.1
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  very_good_analysis: ">=10.3.0 <12.0.0"
  # Pigeon channel definitions used by the test wakelock mock.
  wakelock_plus_platform_interface: ^1.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/SimplyMorse_icon1024.png
    - test/assets/recordings/
